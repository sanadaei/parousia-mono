<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain 3D Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fb6cc; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: fixed; top: 8px; left: 8px; background: rgba(16, 20, 26, 0.78); color: #e6e9ee; padding: 8px 10px; border-radius: 6px; width: 230px; }
  #panel.hidden > :not(.head) { display: none; }
  #panel .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 3px 0; }
  #panel input[type=range] { width: 120px; }
  #panel button { background: #2b3440; color: #e6e9ee; border: 1px solid #46505e; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  #info { white-space: pre; font: 11px/1.35 ui-monospace, monospace; color: #b9c2cf; margin-top: 6px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #fff; background: #222; padding: 24px; white-space: pre-wrap; font: 13px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel">
  <div class="head"><span id="title">terrain</span><button id="toggle" title="Hide panel">–</button></div>
  <div class="row" id="presets"></div>
  <div class="row" id="levels"></div>
  <label>Vertical ×<input id="exag" type="range" min="1" max="4" step="0.1" value="1"><span id="exagV">1.0</span></label>
  <label>Sun azimuth<input id="sunAz" type="range" min="0" max="360" step="1" value="225"></label>
  <label>Sun elevation<input id="sunEl" type="range" min="2" max="80" step="1" value="32"></label>
  <label>Haze<input id="haze" type="range" min="0" max="3" step="0.05" value="1"></label>
  <div id="info"></div>
  <div style="margin-top:4px;color:#8c96a3">drag: orbit · right/shift-drag: pan · wheel: zoom · 1–6: presets · H: panel</div>
</div>
<div id="err"></div>
<script type="module" src="./viewer.mjs"></script>
</body>
</html>
