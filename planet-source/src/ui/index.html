<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continuous Terrain &amp; Water Visualizer</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="./style.css">
  <!-- The canonical core hashes snapshots with node:crypto; the shim provides the same SHA-256 in the browser. -->
  <script type="importmap">{ "imports": { "node:crypto": "./node-crypto-shim.mjs" } }</script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19 9 8l4 6 3-4 6 9z" fill="currentColor" opacity=".9"/><path d="M2 21h20" stroke="#5cb6ff" stroke-width="2"/></svg>
        <span>Terrain &amp; Water <em>Stage 5</em></span>
      </div>
      <div class="controls">
        <a href="../globe/index.html" class="ghost">3D Globe</a>
        <a href="../globe/index.html?terrain=shape-first" class="ghost">Shape-first 地形（試作）</a>
        <label class="field inline">
          <span>Scene</span>
          <select id="preset-select" aria-label="Preset scene"></select>
        </label>
        <button id="open-file" class="ghost" title="Open a JSON snapshot or scene bundle (or drop it anywhere)">Open JSON…</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden>
        <label id="view-field" class="field inline" hidden>
          <span>Chart</span>
          <select id="view-select" aria-label="Chart view"></select>
          <span class="segmented">
            <button id="chart-prev" class="small" title="Previous water chart ([)" aria-label="Previous chart">‹</button>
            <button id="chart-next" class="small" title="Next water chart (])" aria-label="Next chart">›</button>
          </span>
        </label>
      </div>
      <div class="controls tools" role="toolbar" aria-label="Map tools">
        <div class="segmented">
          <button id="tool-pan" class="on" title="Pan / inspect (drag to pan, click to pin)">Pan</button>
          <button id="tool-profile" title="Draw a cross-section (P, or Shift+drag)">Profile</button>
          <button id="tool-sandbox" title="Interactive placement: click to place a test pad, or two points for a test road (S)">Sandbox</button>
        </div>
        <div class="segmented" id="sandbox-modes" role="group" aria-label="Sandbox placement" hidden>
          <button id="sandbox-pad" class="on" title="Click to place a temporary building pad">Pad</button>
          <button id="sandbox-road" title="Click two points to draw a temporary road segment">Road</button>
        </div>
        <button id="fit-view" class="ghost" title="Fit scene (F)">Fit</button>
        <div class="segmented layer-toggles" id="layer-toggles" role="group" aria-label="Quick layer toggles"></div>
        <details class="menu" id="layers-menu">
          <summary class="ghost">Layers</summary>
          <div class="menu-body" id="layers-body"></div>
        </details>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </header>

    <main class="workspace">
      <section class="map-pane" aria-label="Map">
        <canvas id="map-canvas"></canvas>
        <div class="map-hud">
          <div id="hud-coords" class="hud-chip">—</div>
          <div id="hud-tiles" class="hud-chip muted"></div>
        </div>
        <div class="map-legend">
          <canvas id="legend-canvas" width="160" height="10"></canvas>
          <div class="legend-labels"><span id="legend-min"></span><span id="legend-max"></span></div>
        </div>
        <div class="map-legend traffic-legend" id="traffic-legend" hidden></div>
        <div class="map-legend drainage-legend" id="drainage-legend" hidden></div>
        <div class="map-help muted">Drag pan · wheel zoom · Shift+drag profile · click pin/select · F fit · P profile · S sandbox · T trafficability · D drainage · [ ] chart · Esc unpin</div>
      </section>

      <aside class="sidebar">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="inspect" class="on">Inspector</button>
          <button role="tab" data-tab="crossings">Crossings <span id="crossing-count" class="count"></span></button>
          <button role="tab" data-tab="sandbox">Sandbox <span id="sandbox-count" class="count"></span></button>
          <button role="tab" data-tab="lod">LOD</button>
          <button role="tab" data-tab="scene">Scene</button>
        </nav>
        <div class="tab-panel on" data-panel="inspect" id="inspector-panel"></div>
        <div class="tab-panel" data-panel="crossings" id="crossing-panel"></div>
        <div class="tab-panel" data-panel="sandbox" id="sandbox-panel"></div>
        <div class="tab-panel" data-panel="lod" id="lod-panel"></div>
        <div class="tab-panel" data-panel="scene" id="scene-panel"></div>
      </aside>

      <section class="profile-pane" aria-label="Profile">
        <div class="pane-head">
          <span id="profile-title" class="muted">Profile</span>
          <div class="spacer"></div>
          <select id="road-select" aria-label="Road profile"></select>
          <button id="profile-reset" class="ghost small" title="Reset zoom (double-click chart)">Reset zoom</button>
          <button id="profile-csv" class="ghost small" disabled>Export CSV</button>
          <button id="profile-clear" class="ghost small" disabled>Clear</button>
        </div>
        <canvas id="profile-canvas"></canvas>
      </section>
    </main>

    <div class="drop-overlay" id="drop-overlay"><div>Drop a terrain snapshot or scene bundle (.json)</div></div>
    <div class="loading-overlay" id="loading" hidden><div class="spinner"></div><div id="loading-text">Loading…</div></div>
    <div class="toast" id="toast" role="alert" hidden></div>
  </div>
  <script type="module">
    import { createApp } from './app.mjs';
    window.terrainVisualizer = createApp(document.getElementById('app'));
  </script>
</body>
</html>
