<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>気温・降水・バイオーム</title><style>body{font:15px system-ui;background:#101c22;color:#e5ecea;margin:20px}canvas{width:100%;height:auto;image-rendering:pixelated}label{display:inline-block;margin:10px}select{font:inherit}pre{white-space:pre-wrap}#status{color:#e8c984}a{color:#9bd6cf}</style><h1>気温・降水・バイオーム</h1><p>地球型の簡易モデルによる長期平均です。実際の天気・植生調査・食料生産量ではありません。</p><label>表示 <select id="layer"><option value="temperature">気温</option><option value="precipitation">降水</option><option value="biome">潜在バイオーム</option><option value="water-warning">既存水系との注意箇所</option></select></label><label>期間 <select id="month"><option value="annual">年間</option><option value="0">1月</option><option value="1">2月</option><option value="2">3月</option><option value="3">4月</option><option value="4">5月</option><option value="5">6月</option><option value="6">7月</option><option value="7">8月</option><option value="8">9月</option><option value="9">10月</option><option value="10">11月</option><option value="11">12月</option></select></label><p id="status">読込中</p><p id="legend"></p><canvas id="map" width="1280" height="640" aria-label="気候と潜在植生の全球地図"></canvas><pre id="cell">地図をクリックして、同じ地点の数値と12か月の変化を確認できます。</pre><details open><summary>計算上の注意と未実装</summary><pre id="limits"></pre></details><script type="module" src="./climate-view.mjs"></script></html>
