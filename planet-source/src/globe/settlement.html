<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>集落の配置理由</title><style>body{font:16px system-ui;margin:24px;background:#faf9f4;color:#252c29}main{display:grid;grid-template-columns:minmax(250px,2fr) minmax(230px,1fr);gap:20px}svg{width:100%;background:#edf0e5;border:1px solid #aab3a2}button,select{font:inherit}section{min-width:0}#choose{width:100%;max-width:100%}#map{height:70vh;max-height:800px}pre{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:700px){main{display:block}}</style><h1>集落の配置理由</h1><p id="status">保存データを読込中</p><p>建物を選ぶと、用途・入口の向き・立地条件・原料の供給元を表示します。画面操作で配置は変わりません。</p><p><label>区画番号（0から） <input id="district" type="number" min="0" value="0" step="1" style="width:7em"></label> <button id="load-district" disabled>この区画を見る</button> <span id="district-count"></span></p><main><svg id="map" viewBox="-370 -370 740 740" aria-label="保存済み集落の平面図"></svg><section><label>施設を選ぶ <select id="choose"></select></label><p id="explanation"></p><details><summary>詳しい根拠データ</summary><pre id="details"></pre></details><details><summary>配置できなかった施設</summary><pre id="rejected"></pre></details><details><summary>敷地・通路の問題（旧配置を含む）</summary><pre id="survey-issues"></pre></details></section></main><script type="module" src="./settlement-view.mjs"></script></html>
