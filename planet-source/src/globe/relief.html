<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地域地形の確認 | planet</title>
<style>body{margin:0;background:#101924;color:#e4edf3;font:15px system-ui,sans-serif}header,aside{padding:16px}header h1{font-size:20px;margin:0 0 8px}header p{margin:6px 0;color:#bbccd7}a{color:#9bd4ff}main{display:grid;grid-template-columns:290px 1fr;min-height:70vh}label{display:block;margin:15px 0}input[type=range]{display:block;width:100%}input[type=number]{width:90px}button,input[type=file]{max-width:100%;font:inherit}button{padding:9px;margin:5px 0;background:#25435a;color:white;border:1px solid #7895aa;border-radius:5px}button:disabled{opacity:.45}#stage{min-height:420px;height:72vh;background:#04070d}canvas{width:100%;height:100%;display:block}pre{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#state{padding:10px;background:#1e3040;min-height:2em}details{margin-top:18px}small{color:#bacbd8}@media(max-width:720px){main{display:flex;flex-direction:column}aside{order:2}#stage{height:55vh;min-height:300px}}</style>
<header><h1>地域地形を、元の形のまま確認する</h1><p>保存した三角形の地形を開き、角度・距離を変えて見られます。惑星全体への組み込み前の地域ビューです。</p><a href="./index.html">惑星ビューへ戻る</a> · <a href="../ui/index.html">高さ・傾斜を調べる地図へ</a></header>
<main><aside><label>地域地形のJSON<input id="file" type="file" accept=".json,application/json"></label><p id="state" role="status">terrain.json または地球の参考地形を開いてください。</p>
<label>向き <output id="heading-value">0°</output><input id="heading" type="range" min="-180" max="180" value="0"></label>
<label>傾き <output id="tilt-value">45°</output><input id="tilt" type="range" min="0" max="70" value="45"></label>
<label>距離 <output id="distance-value">—</output><input id="distance" type="range" min="0" max="1000" value="600"></label>
<label>高さの強調 <output id="scale-value">1×</output><input id="scale" type="range" min="1" max="10" step=".25" value="1"></label><small>強調は表示だけに適用します。確認用の固定照明です。欠測部分や水面を勝手に作りません。</small>
<div><button id="reset" disabled>視点を戻す</button> <button id="recover" disabled>描画を再準備</button></div><button id="report" disabled>確認記録を保存</button>
<details><summary>座標と技術情報</summary><p>下の座標は地域の配置先となる球面参照座標です。地球の参考データの測地座標を自動復元する機能ではありません。</p><label>中心緯度 <input id="lat" type="number" min="-90" max="90" value="0" step=".01"></label><label>中心経度 <input id="lon" type="number" min="-180" max="180" value="0" step=".01"></label><small>座標の変更は次のファイル読込時に適用されます。</small><pre id="details">未読込</pre></details></aside><div id="stage"><canvas id="view" aria-label="地域地形の三次元表示"></canvas></div></main>
<script type="module" src="./relief-view.mjs"></script></html>
